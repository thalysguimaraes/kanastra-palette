[package]
name = "kanastra-palette-rs"
version = "0.2.0"
edition = "2021"
authors = ["Thalys Guimarães"]
description = "A beautiful terminal-based color palette generator with advanced features"
license = "MIT"
repository = "https://github.com/thalysguimaraes/kanastra-palette"
keywords = ["color", "palette", "terminal", "ui", "wcag"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
# Color manipulation
palette = { version = "0.7", features = ["std", "serializing"] }

# Terminal UI
ratatui = "0.28"
crossterm = "0.27"

# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Clipboard support
arboard = "3.4"

# Random number generation
rand = "0.8"

# Math utilities for color calculations
approx = "0.5"

[dev-dependencies]
# Testing
pretty_assertions = "1.4"
rstest = "0.18"
